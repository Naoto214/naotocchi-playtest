      if (idx !== i) return;
      if (e && e.name === 'AbortError') return; // 別の 曲に 切りかえた
      if (e && e.name === 'NotAllowedError') { showError(i, '再生が 許可されませんでした。もう一度 ▶ を 押して ください。'); return; }
      showError(i, loadMessage(i, audio.error ? audio.error.code : 4));
    });
    if ('mediaSession' in navigator && window.MediaMetadata) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: 'なおとっち BGM V2', album: t.cat }); } catch (e) {}
    }
    $('tr-' + i).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button.row'); if (!b) return;
    var i = +b.dataset.i;
    if (i === idx && !audio.paused) { audio.pause(); return; }
    if (i === idx && audio.src && audio.paused && !audio.error) { audio.play().catch(function (er) { showError(i, '再生できませんでした（' + er.message + '）'); }); return; }
    playIndex(i);
  });
  document.querySelectorAll('.modes button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
  $('play').addEventListener('click', function () {
    if (idx < 0) { playIndex(0); return; }
    if (audio.error) { playIndex(idx); return; }
    if (audio.paused) audio.play().catch(function (er) { showError(idx, '再生できませんでした（' + er.message + '）'); }); else audio.pause();
  });
  $('prev').addEventListener('click', function () { playIndex(idx <= 0 ? 0 : idx - 1); });
  $('next').addEventListener('click', function () { playIndex(idx < 0 ? 0 : Math.min(TRACKS.length - 1, idx + 1)); });
  audio.addEventListener('playing', function () { status(mode === 'loop' ? 'ループ再生中' : mode === 'continuous' ? '連続再生中' : '再生中'); $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', '一時停止'); });
  audio.addEventListener('pause', function () { if (!audio.error && !audio.ended) status('一時停止'); $('play').textContent = '▶'; $('play').setAttribute('aria-label', '再生'); });
  audio.addEventListener('waiting', function () { status('読み込み中…'); });
  audio.addEventListener('error', function () {
    if (idx < 0 || !audio.getAttribute('src')) return;
    showError(idx, loadMessage(idx, audio.error ? audio.error.code : 0));
  });
  audio.addEventListener('timeupdate', function () {
    var d = audio.duration && isFinite(audio.duration) ? audio.duration : (idx >= 0 ? TRACKS[idx].dur : 0);
    $('cur').textContent = fmt(audio.currentTime);
    if (!seeking && d) $('seek').value = Math.round(audio.currentTime / d * 1000);
  });
  audio.addEventListener('ended', function () {
    if (mode === 'continuous' && idx < TRACKS.length - 1) { playIndex(idx + 1); return; }
    status(mode === 'continuous' ? '32曲 再生しました' : '再生おわり'); $('play').textContent = '▶';
  });
  var seek = $('seek');
  seek.addEventListener('input', function () { seeking = true; var d = audio.duration || (idx >= 0 ? TRACKS[idx].dur : 0); $('cur').textContent = fmt(seek.value / 1000 * d); });
  seek.addEventListener('change', function () { var d = audio.duration || (idx >= 0 ? TRACKS[idx].dur : 0); try { audio.currentTime = seek.value / 1000 * d; } catch (e) {} seeking = false; });
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('previoustrack', function () { playIndex(Math.max(0, idx - 1)); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { playIndex(Math.min(TRACKS.length - 1, idx + 1)); });
    } catch (e) {}
  }
  setMode('single');
  window.NAOTOCCHI_BGM_V2_LISTEN = { tracks: TRACKS, audio: audio, state: function () { return { mode: mode, idx: idx }; } };
})();
</script>
